<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wells Walkies | Book Now</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container header-container">
        <div class="logo-text">
          <h1>Wells Walkies</h1>
          <p>Premium Dog Care</p>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
          <a href="reviews.html">Reviews</a>
          <a href="contact.html">Contact</a>
          <a href="book.html" class="active book-now-btn">Book Now</a>
        </nav>
      </div>
    </header>

    <section class="booking container">
      <h2 class="section-title gradient-text">Book a Consultation</h2>
      <form
        action="mailto:info@wellswalkies.co.za"
        method="POST"
        class="booking-form"
      >
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="tel" name="phone" placeholder="Phone" />
        <input type="text" name="dog-name" placeholder="Dog's Name" required />
        <textarea
          name="message"
          placeholder="Tell us about your dog"
          rows="5"
        ></textarea>
        <button type="submit" class="btn-primary">Schedule Consultation</button>
      </form>
    </section>

    <footer>
      <div class="footer-logo">
        <h1>Wells Walkies</h1>
      </div>
      <p>Trusted by 350+ dog families in Benoni</p>
      <div class="footer-info">
        <span>Email: info@wellswalkies.co.za</span> |
        <span>Phone: 065 932 9535</span>
      </div>
    </footer>
  </body>
</html>
